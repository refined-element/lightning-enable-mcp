name: Build MCPB Bundle

# Builds the MCP Bundle (mcpb/) and uploads it as a downloadable artifact.
# Decoupled from publish-mcp.yml on purpose: it must never create an mcp-v* tag
# or GitHub release, because publish-mcp.yml triggers on those and would
# double-publish the packages. This job only validates, packs, and uploads.

on:
  push:
    branches: [main]
    paths:
      - 'mcpb/**'
      - 'dotnet/src/LightningEnable.Mcp/LightningEnable.Mcp.csproj'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync mcpb/ version to the package version (csproj is the source of truth)
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' dotnet/src/LightningEnable.Mcp/LightningEnable.Mcp.csproj | head -n1)
          if [ -z "$VERSION" ]; then echo "::error::could not read <Version> from csproj"; exit 1; fi
          echo "Stamping mcpb/ to $VERSION"
          jq --arg v "$VERSION" '.version = $v' mcpb/manifest.json > mcpb/manifest.tmp && mv mcpb/manifest.tmp mcpb/manifest.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" mcpb/pyproject.toml
          sed -i -E "s/lightning-enable-mcp==[0-9][0-9.]*/lightning-enable-mcp==$VERSION/" mcpb/pyproject.toml
          echo "MCPB_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "--- stamped manifest.json version + pyproject pin ---"
          jq -r '.version' mcpb/manifest.json
          grep -E 'version|lightning-enable-mcp==' mcpb/pyproject.toml

      - name: Validate manifest
        run: npx -y @anthropic-ai/mcpb validate mcpb/manifest.json

      - name: Pack bundle
        run: npx -y @anthropic-ai/mcpb pack mcpb mcpb/lightning-enable-mcp.mcpb

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightning-enable-mcp-${{ env.MCPB_VERSION }}-mcpb
          path: mcpb/lightning-enable-mcp.mcpb
          if-no-files-found: error
