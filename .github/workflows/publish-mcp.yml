name: Publish MCP Packages

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/src/LightningEnable.Mcp/LightningEnable.Mcp.csproj'
      - 'python/lightning-enable-mcp/pyproject.toml'
      - 'python/lightning-enable-mcp/Dockerfile'
      # server.json and this workflow file are deliberately NOT push-path triggers.
      # A change to either with no package-content change would re-run the full
      # release: Docker gets rebuilt from current code while NuGet/PyPI skip-duplicate
      # the already-published version — making the Docker image diverge from the
      # packages for the same version number. Recover a drifted server.json with a
      # manual workflow_dispatch run instead (see the verify-versions failure message).
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish to NuGet'
        required: false
        default: 'true'
        type: boolean
      publish_pypi:
        description: 'Publish to PyPI'
        required: false
        default: 'true'
        type: boolean
      publish_docker:
        description: 'Publish to Docker Hub'
        required: false
        default: 'true'
        type: boolean

env:
  DOTNET_VERSION: '9.0.x'
  PYTHON_VERSION: '3.11'

jobs:
  # ── GATE ───────────────────────────────────────────────────────────────────
  # Runs FIRST, before anything is published, and both publish jobs depend on it.
  # It derives the release version and proves server.json already advertises that
  # exact version everywhere mcp-publisher reads it (.version, both package
  # versions, and the pinned Docker tag). Version drift therefore fails the whole
  # release ATOMICALLY, up front — no NuGet/PyPI/Docker artifact is ever pushed for
  # a release whose server.json is out of sync. (Previously this check lived inside
  # publish-registry, i.e. AFTER the packages had already shipped.)
  verify-versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate server.json description length
        run: |
          DESC=$(jq -r '.description' server.json)
          LEN=${#DESC}
          if [ "$LEN" -gt 100 ]; then
            echo "::error::server.json description is $LEN chars (max 100): $DESC"
            exit 1
          fi
          echo "server.json description OK ($LEN chars)"

      - name: Extract version from tag or csproj
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mcp-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          else
            # First <Version> match only — defends against the tag appearing in comments.
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' dotnet/src/LightningEnable.Mcp/LightningEnable.Mcp.csproj | head -n1)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Verify server.json version matches release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # server.json is committed source-of-truth and must ALREADY declare the release
          # version in every place mcp-publisher reads it (.version, both package versions,
          # and the Docker image pin). We VERIFY and fail loudly on drift rather than silently
          # rewriting an ephemeral copy at publish time — a jq-rewrite would hide the fact
          # that the committed server.json was stuck at an old version, so the file in the repo
          # would keep lying about which version was published. This gate runs BEFORE any
          # package/image is pushed, so drift aborts the release atomically.
          SJ_VERSION=$(jq -r '.version' server.json)
          SJ_NUGET=$(jq -r '.packages[0].version' server.json)
          SJ_PYPI=$(jq -r '.packages[1].version' server.json)
          SJ_DOCKER=$(jq -r '.packages[2].identifier' server.json)
          EXPECTED_DOCKER="docker.io/refinedelement/lightning-enable-mcp:${VERSION}"
          FAIL=0
          if [ "$SJ_VERSION" != "$VERSION" ]; then
            echo "::error::server.json .version is '$SJ_VERSION' but the release version is '$VERSION'"; FAIL=1
          fi
          if [ "$SJ_NUGET" != "$VERSION" ]; then
            echo "::error::server.json .packages[0].version (nuget) is '$SJ_NUGET' but the release version is '$VERSION'"; FAIL=1
          fi
          if [ "$SJ_PYPI" != "$VERSION" ]; then
            echo "::error::server.json .packages[1].version (pypi) is '$SJ_PYPI' but the release version is '$VERSION'"; FAIL=1
          fi
          if [ "$SJ_DOCKER" != "$EXPECTED_DOCKER" ]; then
            echo "::error::server.json .packages[2].identifier (docker) is '$SJ_DOCKER' but expected '$EXPECTED_DOCKER'"; FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::server.json is out of sync with release version $VERSION. Bump server.json (.version, both .packages[].version, and the docker image pin) in the SAME commit as the csproj/pyproject version bump and merge to main. To recover an ALREADY-drifted server.json, start a manual 'Run workflow' (workflow_dispatch) run — it checks out current main and re-verifies against the corrected file. Do NOT 're-run the failed job': that replays the old commit SHA (the drifted server.json) and fails again. server.json is intentionally not a push-path trigger, so committing the fix by itself will not auto-start a release."
            exit 1
          fi
          echo "server.json is in sync with release version $VERSION"
          jq '.version, .packages[].version, .packages[2].identifier' server.json

      - name: Verify pyproject.toml version matches release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # pyproject.toml carries its OWN version (the PyPI package version). If it is
          # not bumped alongside the csproj, NuGet would ship ahead of PyPI for the same
          # release. Anchor on a line that STARTS with `version = "` so the `[tool.*]`
          # python_version / target-version keys can never be mistaken for it. Fail
          # loudly on drift, up front, before any package/image is pushed.
          # `|| true` so a no-match grep (exit 1) under `bash -eo pipefail` can't kill the
          # step at the assignment BEFORE the descriptive -z guard below runs. Fails closed
          # either way (empty PY_VERSION -> the guard exits 1), just with the intended message.
          PY_VERSION=$(grep -oP '^version = "\K[^"]+' python/lightning-enable-mcp/pyproject.toml | head -n1 || true)
          if [ -z "$PY_VERSION" ]; then
            echo "::error::Could not read the [project] version from python/lightning-enable-mcp/pyproject.toml"
            exit 1
          fi
          if [ "$PY_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml version is '$PY_VERSION' but the release version is '$VERSION'. Bump python/lightning-enable-mcp/pyproject.toml in the SAME commit as the csproj/server.json version bump so NuGet cannot ship ahead of PyPI."
            exit 1
          fi
          echo "pyproject.toml version is in sync with release version $VERSION"

      - name: Verify mcpb/ bundle version matches release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The MCP Bundle (mcpb/) is a FIFTH published artifact (Claude Desktop / Smithery
          # Local / Anthropic Directory). mcpb.yml auto-stamps it from the csproj at build
          # time, but the COMMITTED mcpb/ files must ALSO match the release so the repo never
          # advertises a stale bundle version — and so a hand-edit that drifts them from the
          # csproj is caught here up front, before anything publishes. Three places must agree:
          # manifest.json .version, pyproject.toml [project] version, and the pyproject pin on
          # the published package the bundle wraps. Same fail-loud pattern as the pyproject check.
          MCPB_MANIFEST=$(jq -r '.version' mcpb/manifest.json)
          # Anchor on the `version = "` line (the [project] version), same as pyproject above.
          MCPB_PY=$(grep -oP '^version = "\K[^"]+' mcpb/pyproject.toml | head -n1 || true)
          # The bundle pins the exact package version it wraps — it must match too, or the
          # bundle would install a different version than it claims.
          MCPB_PIN=$(grep -oP 'lightning-enable-mcp==\K[0-9][0-9.]*' mcpb/pyproject.toml | head -n1 || true)
          FAIL=0
          if [ "$MCPB_MANIFEST" != "$VERSION" ]; then
            echo "::error::mcpb/manifest.json .version is '$MCPB_MANIFEST' but the release version is '$VERSION'"; FAIL=1
          fi
          if [ -z "$MCPB_PY" ] || [ "$MCPB_PY" != "$VERSION" ]; then
            echo "::error::mcpb/pyproject.toml version is '$MCPB_PY' but the release version is '$VERSION'"; FAIL=1
          fi
          if [ -z "$MCPB_PIN" ] || [ "$MCPB_PIN" != "$VERSION" ]; then
            echo "::error::mcpb/pyproject.toml pins lightning-enable-mcp==$MCPB_PIN but the release version is '$VERSION'"; FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::mcpb/ bundle is out of sync with release version $VERSION. Bump mcpb/manifest.json (.version) and mcpb/pyproject.toml (version + the lightning-enable-mcp== pin) in the SAME commit as the csproj/pyproject/server.json bump."
            exit 1
          fi
          echo "mcpb/ bundle is in sync with release version $VERSION"

  publish-packages:
    runs-on: ubuntu-latest
    needs: [verify-versions]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build and publish .NET MCP
        if: github.event_name == 'push' || github.event.inputs.publish_nuget == 'true'
        run: |
          cd dotnet/src/LightningEnable.Mcp
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet pack --configuration Release --no-build --output ./nupkg

          echo "=== Publishing to NuGet ==="
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          echo "=== NuGet Package Published ==="
          echo "Package: LightningEnable.Mcp"
          echo "Version: ${{ needs.verify-versions.outputs.version }}"
          echo "URL: https://www.nuget.org/packages/LightningEnable.Mcp"

      - name: Build and publish Python MCP
        if: github.event_name == 'push' || github.event.inputs.publish_pypi == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd python/lightning-enable-mcp
          pip install build twine
          python -m build

          echo "=== Publishing to PyPI ==="
          twine upload --skip-existing dist/*

          echo "=== PyPI Package Published ==="
          echo "Package: lightning-enable-mcp"
          echo "Version: ${{ needs.verify-versions.outputs.version }}"
          echo "URL: https://pypi.org/project/lightning-enable-mcp"

  publish-docker:
    runs-on: ubuntu-latest
    # Gate on BOTH the up-front version check AND the package pushes. Docker's mutable
    # `latest` tag must never advance to a version that failed to publish to NuGet/PyPI —
    # otherwise `docker pull refinedelement/lightning-enable-mcp:latest` would ship a
    # version that does not exist on the other two registries. Waiting on
    # publish-packages means a NuGet/PyPI failure blocks Docker instead of racing it.
    needs: [verify-versions, publish-packages]
    if: github.event_name == 'push' || github.event.inputs.publish_docker == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: refinedelement/lightning-enable-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.verify-versions.outputs.version }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: python/lightning-enable-mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Prepare Docker Hub README (rewrite relative links to absolute GitHub URLs)
        # Cosmetic README prep for the description sync below — the image is already pushed,
        # so a failure here must NOT fail the job and strand publish-registry (needs: publish-docker).
        continue-on-error: true
        run: |
          # README.md uses relative paths (dotnet/..., python/..., etc.) which don't
          # resolve on Docker Hub. Generate a Docker-Hub-specific copy with absolute
          # GitHub URLs so links render correctly on the listing page.
          REPO_URL="https://github.com/refined-element/lightning-enable-mcp"
          # Pin link targets to the exact commit that produced this image rather than `main`,
          # so the Docker Hub README keeps pointing at the version it was published alongside
          # even after main moves on.
          BLOB_REF="${GITHUB_SHA}"
          sed -E \
            -e "s|\]\((dotnet/[^)]+)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            -e "s|\]\((python/[^)]+)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            -e "s|\]\((docs/[^)]+)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            -e "s|\]\((server\.json)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            -e "s|\]\((LICENSE)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            -e "s|\]\((CHANGELOG\.md)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            -e "s|\]\((CONTRIBUTING\.md)\)|](${REPO_URL}/blob/${BLOB_REF}/\1)|g" \
            README.md > README.dockerhub.md
          echo "=== Docker Hub README preview (first 40 lines) ==="
          head -n 40 README.dockerhub.md

      - name: Update Docker Hub description
        # Cosmetic README sync only — the image is already pushed by this point, so a transient
        # failure here must NOT fail the job and strand publish-registry (which needs: publish-docker).
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: refinedelement/lightning-enable-mcp
          short-description: "MCP server: AI agent Lightning payments (L402, Strike, LND, NWC). Free + subscription tools. MIT."
          readme-filepath: ./README.dockerhub.md

  publish-registry:
    runs-on: ubuntu-latest
    # The registry entry pins VERSIONED NuGet/PyPI/Docker artifacts, so it must only
    # ever be published once all three actually exist. It `needs` all three publish
    # jobs, which makes it run last and inherit their success/skip semantics:
    #  - If publish-docker is SKIPPED (workflow_dispatch with publish_docker=false) or
    #    FAILS, this job is cleanly skipped too — instead of the old behavior of polling
    #    a never-built image for 10 minutes and then red-failing a valid run.
    #  - Because publish-docker SUCCEEDED before control reaches here, the pinned Docker
    #    tag is guaranteed to exist, so there is NO Docker existence poll below. Only the
    #    NuGet + PyPI indexing polls remain — those registries are eventually-consistent
    #    and can briefly 404 right after a successful push, so they still need polling.
    needs: [verify-versions, publish-packages, publish-docker]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Wait for published packages to exist (NuGet, PyPI)
        run: |
          VERSION="${{ needs.verify-versions.outputs.version }}"
          # HARD existence gate for the eventually-consistent package registries.
          # server.json advertises a versioned NuGet package and a versioned PyPI
          # package; both can briefly 404 immediately after their push while the index
          # catches up. Publishing the registry entry before they resolve would
          # advertise an artifact that 404s. Each check bounded-retries, then `exit 1`
          # on exhaustion so the JOB FAILS (and is re-runnable) instead of silently
          # advertising a phantom ref.
          #
          # The pinned Docker tag is intentionally NOT polled here: publish-registry
          # `needs: publish-docker`, so reaching this step means the Docker job already
          # succeeded and the tag exists. (Skipping the poll also avoids false-failing a
          # slow cold multi-arch arm64/QEMU build, and cleanly skips this whole job when
          # Docker was disabled via workflow_dispatch.)
          poll() {
            # poll <label> <url> <attempts>  -> 0 if it ever returns HTTP 200
            local label="$1" url="$2" attempts="$3" status
            local i
            for i in $(seq 1 "$attempts"); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              if [ "$status" = "200" ]; then
                echo "$label: available ($VERSION)"
                return 0
              fi
              echo "$label: attempt $i/$attempts returned $status, waiting 15s..."
              sleep 15
            done
            return 1
          }

          # NuGet flat-container nuspec (package id is lowercased in this API).
          if ! poll "NuGet" "https://api.nuget.org/v3-flatcontainer/lightningenable.mcp/$VERSION/lightningenable.mcp.nuspec" 20; then
            echo "::error::NuGet package LightningEnable.Mcp $VERSION never became available — refusing to advertise it in the MCP Registry."
            exit 1
          fi

          # PyPI JSON metadata for the exact version.
          if ! poll "PyPI" "https://pypi.org/pypi/lightning-enable-mcp/$VERSION/json" 20; then
            echo "::error::PyPI package lightning-enable-mcp $VERSION never became available — refusing to advertise it in the MCP Registry."
            exit 1
          fi

          # The Docker tag is guaranteed by `needs: publish-docker` — no poll needed.
          echo "NuGet + PyPI are indexed for $VERSION and the Docker job succeeded — safe to publish the registry entry."

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          # Tolerate a duplicate version the same way the NuGet (--skip-duplicate)
          # and PyPI (--skip-existing) steps do. The publish workflow triggers on any
          # change to the csproj/pyproject/Dockerfile (server.json is not a push trigger) —
          # not only version bumps — so a non-version-bump change would otherwise hard-fail this job with
          # "cannot publish duplicate version" even though the package jobs correctly
          # no-op. Only the duplicate case is swallowed; any other failure still fails.
          set +e
          OUT=$(./mcp-publisher publish --file=server.json 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            if echo "$OUT" | grep -qi "duplicate version"; then
              echo "::notice::MCP Registry already has this version — skipping (parity with NuGet/PyPI skip-duplicate)."
              exit 0
            fi
            echo "::error::mcp-publisher failed for a non-duplicate reason."
            exit $CODE
          fi

  summary:
    runs-on: ubuntu-latest
    needs: [verify-versions, publish-packages, publish-docker, publish-registry]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## MCP Package Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.verify-versions.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install Commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Command |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| .NET | \`dotnet tool install --global LightningEnable.Mcp\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | \`pip install lightning-enable-mcp\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | \`docker pull refinedelement/lightning-enable-mcp:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [NuGet](https://www.nuget.org/packages/LightningEnable.Mcp)" >> $GITHUB_STEP_SUMMARY
          echo "- [PyPI](https://pypi.org/project/lightning-enable-mcp)" >> $GITHUB_STEP_SUMMARY
          echo "- [Docker Hub](https://hub.docker.com/r/refinedelement/lightning-enable-mcp)" >> $GITHUB_STEP_SUMMARY
          echo "- [MCP Registry](https://registry.modelcontextprotocol.io)" >> $GITHUB_STEP_SUMMARY
