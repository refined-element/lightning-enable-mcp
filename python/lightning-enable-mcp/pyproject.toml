[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightning-enable-mcp"
version = "1.24.0"
description = "Part of Lightning Enable — infrastructure for agent commerce over Lightning. MCP server for L402 Lightning payments, API discovery, and agent commerce."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lightning Enable", email = "support@lightningenable.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "lightning",
    "bitcoin",
    "l402",
    "lsat",
    "payments",
    "ai",
    "agents",
    "nostr",
    "nwc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.25.0",
    # httpcore is used DIRECTLY by ssrf_transport.py (a custom SSRF-safe network backend
    # + connection pool). Pin it so the private-backend seam we depend on can't drift.
    "httpcore>=1.0,<2",
    "aiohttp>=3.13.4",
    "pydantic>=2.0.0",
    "bolt11>=2.0.0",
    "websockets>=12.0",
    "bech32>=1.2.0",
    "cryptography>=46.0.7",
    # NWC (Nostr Wallet Connect) pubkey derivation + BIP340 Schnorr + ECDH.
    # coincurve ships prebuilt wheels for Linux, macOS AND Windows, so NWC works
    # out of the box on every platform with no build toolchain — no extra needed.
    # (Replaced the old `secp256k1` C-extension, which had no Windows wheel.)
    "coincurve>=20.0.0",
]

[project.optional-dependencies]
# Back-compat no-op: `pip install lightning-enable-mcp[nwc]` still resolves. NWC
# support is now in the base dependencies (coincurve), so this extra is empty and
# exists only so existing install commands don't break.
nwc = []
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://lightningenable.com"
Documentation = "https://github.com/refined-element/lightning-enable-mcp"
Repository = "https://github.com/refined-element/lightning-enable-mcp"
Issues = "https://github.com/refined-element/lightning-enable-mcp/issues"

[project.scripts]
lightning-enable-mcp = "lightning_enable_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_enable_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=lightning_enable_mcp --cov-report=term-missing"
# Prepend the local src/ so the test suite always exercises THIS checkout's
# package, not whatever an editable-install .pth happens to point at (important
# when running from a git worktree on a machine with the package installed
# editable from another checkout).
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["lightning_enable_mcp"]
